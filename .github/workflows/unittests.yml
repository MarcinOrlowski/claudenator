name: "Test: Unit tests"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, dev ]

# paths-filter asks the GitHub API for the files a pull request changed, and
# that needs "pull-requests: read", which the repository's default token lacks.
permissions:
  contents: read
  pull-requests: read

jobs:
  unit_tests:
    name: "pytest"
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        # quotes are needed as YAML treats unquoted versions as floats and
        # drops trailing zeros (i.e "3.10" => 3.10, 3.10 => 3.1),
        # so quotes are required.
        python: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: "Checkout sources"
        uses: actions/checkout@v7

      # https://github.com/marketplace/actions/paths-changes-filter
      - name: "Look for changed files..."
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            srcs:
              - '**/*.py'

      - name: "Setup Python"
        if: steps.filter.outputs.srcs == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: "Installing dependencies..."
        if: steps.filter.outputs.srcs == 'true'
        run: pip install -e ".[dev]"

      - name: "Running unit tests..."
        if: steps.filter.outputs.srcs == 'true'
        run: pytest
