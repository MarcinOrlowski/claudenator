name: "Markdown Lint"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, dev ]

# paths-filter asks the GitHub API for the files a pull request changed, and
# that needs "pull-requests: read", which the repository's default token lacks.
permissions:
  contents: read
  pull-requests: read

jobs:
  markdown_lint:
    name: "Markdown linter"
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest ]

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: "Checkout sources"
        uses: actions/checkout@v7

      # https://github.com/marketplace/actions/paths-changes-filter
      - name: "Look for changed doc related files..."
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - '**/*.md'

      # https://github.com/marketplace/actions/my-markdown-linter
      - name: "Running markdown linter..."
        uses: ruzickap/action-my-markdown-linter@v1
        if: steps.filter.outputs.docs == 'true'
        with:
          config_file: .markdownlint.yaml
          # LICENSE is externally sourced and we're not going to fix it.
          exclude: |
            LICENSE.md
